<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The AI Armor">
  <title>The AI Armor</title>
  <rect width="64" height="64" rx="13" fill="#070b14"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="12.5" fill="none" stroke="#1d2e42" stroke-width="1"/>
  <!-- human capability: flat, orange -->
  <path d="M11 41.5H53" stroke="#ffb45e" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <!-- armor multiplier: rising, teal -->
  <path d="M11 50C22 46.5 26.5 41.5 33 30.5 40 18.5 45.5 15.5 53 13.5"
        stroke="#4fe3d0" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <!-- crossing point -->
  <circle cx="30.5" cy="41.5" r="3.1" fill="#070b14" stroke="#e9eef8" stroke-width="2"/>
</svg>
